<title>ว่างไหม</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column of stacked "boards" — calendar + quick-fill side by side on wide screens, then dates vote, places, reset. */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3E9E4; --line:#CCD6CF;
  --ink:#17221C; --muted:#5B6B61;
  --accent:#16775A; --accent-ink:#FFFFFF; --accent-soft:#D3EADF;
  --mine:#E9A72C; --mine-soft:#FBEBC7; --danger:#B83A2E; --danger-soft:#F6DCD8;
  --heat1:#D9EEE3; --heat2:#A9D9C1; --heat3:#6CBC97; --heat4:#2E9468;
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211D; --sunk:#222C27; --line:#2F3B35;
  --ink:#E4ECE7; --muted:#93A59A;
  --accent:#4FC296; --accent-ink:#0C1611; --accent-soft:#1E3A2F;
  --mine:#F0B648; --mine-soft:#3D3220; --danger:#E5705F; --danger-soft:#3E2320;
  --heat1:#1D3329; --heat2:#21533E; --heat3:#2A7D58; --heat4:#3FB582;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --sunk:#222C27; --line:#2F3B35;
  --ink:#E4ECE7; --muted:#93A59A;
  --accent:#4FC296; --accent-ink:#0C1611; --accent-soft:#1E3A2F;
  --mine:#F0B648; --mine-soft:#3D3220; --danger:#E5705F; --danger-soft:#3E2320;
  --heat1:#1D3329; --heat2:#21533E; --heat3:#2A7D58; --heat4:#3FB582;
  color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 14px}
.who b{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mine);flex:none}

.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.board h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:4px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{resize:vertical;min-height:60px}
.err{color:var(--danger);font-size:13px;margin:0}

/* gate */
.gate{border:2px solid var(--accent);background:var(--surface)}
.gate-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip small{color:var(--muted);margin-left:4px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row .field{flex:1 1 180px}

/* calendar */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding-bottom:2px}
.wd.we{color:var(--accent)}
.day{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:9px;border:1px solid transparent;background:var(--sunk);
  cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:5px 6px;min-width:0;text-align:left}
.day .n{font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
.day .c{font-size:11px;font-weight:600;align-self:flex-end;line-height:1}
.day.h1{background:var(--heat1)} .day.h2{background:var(--heat2)} .day.h3{background:var(--heat3)} .day.h4{background:var(--heat4);color:var(--accent-ink)}
.day.mine{box-shadow:inset 0 0 0 3px var(--mine)}
.day.mine::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--mine)}
.day.sel{border-color:var(--ink)}
.day.past{opacity:.35;cursor:default}
.day.blank{background:transparent;cursor:default}
.day.today .n{text-decoration:underline;text-underline-offset:3px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.scale{display:inline-flex;gap:2px}.scale i{margin:0}
.daydetail{margin-top:12px;padding:12px;border-radius:9px;background:var(--bg);border:1px dashed var(--line)}
.daydetail strong{font-family:var(--f-display);font-weight:500}

/* quick fill */
.quick{background:var(--bg);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;align-self:start}
.quick h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0}
.wdpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wdpick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;cursor:pointer;font-weight:500}
.wdpick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.hint{font-size:13px;color:var(--muted);margin:0}

/* date vote list */
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg)}
.drow.lead{background:var(--accent-soft)}
.ddate{font-family:var(--f-display);font-weight:500;line-height:1.2}
.ddate small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:4px 0}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.names{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:1px}
.vote{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.vote.on{background:var(--mine);border-color:var(--mine);color:#2A1E05}
.vote .k{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

/* places */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
.place{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.place.lead{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mapart{position:relative;height:110px;background:
   linear-gradient(var(--line) 1px,transparent 1px) 0 0/22px 22px,
   linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/22px 22px,var(--sunk);
  display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.mapart .road{position:absolute;inset:0;pointer-events:none}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--danger);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.pin::after{content:"";width:12px;height:12px;border-radius:50%;background:#fff}
.mapart .open{position:absolute;right:8px;bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:3px 10px;font-weight:500}
.mapart .coord{position:absolute;left:8px;bottom:8px;font-family:var(--f-num);font-size:11px;color:var(--muted);background:var(--surface);padding:2px 6px;border-radius:6px}
.pbody{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0;overflow-wrap:anywhere}
.pbody p{margin:0;font-size:14px;overflow-wrap:anywhere;white-space:pre-line}
.pmeta{font-size:12px;color:var(--muted)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.pform{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.pform .full{grid-column:1/-1}

/* footer + modal */
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-radius:var(--r);border:1px dashed var(--line)}
.foot p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
.backdrop{position:fixed;inset:0;background:rgba(8,14,11,.55);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;max-width:420px;width:100%;padding:22px;border:1px solid var(--line)}
.modal h3{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0 0 8px}
.modal p{margin:0 0 12px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.warnbox{background:var(--danger-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.banner{background:var(--mine-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.saving{font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .cal-layout{grid-template-columns:1fr}
  .gate-grid{grid-template-columns:1fr}
}
@media (max-width:520px){
  .board{padding:14px}
  .drow{grid-template-columns:1fr auto}
  .drow .mid{grid-column:1/-1;order:3}
  .pform{grid-template-columns:1fr}
  .day{padding:3px 4px}
  .day .c{font-size:10px}
}
@media (prefers-reduced-motion:no-preference){
  .day,.btn,.vote,.chip{transition:background-color .15s,box-shadow .15s,border-color .15s}
}
</style>

<div id="app"><div class="wrap"><p class="sub">กำลังโหลด…</p></div></div>

<script type="text/x-template" id="tpl">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>ว่างไหม</h1>
      <p>ลงวันที่ว่าง เสนอที่นัด แล้วโหวตกัน</p>
    </div>
    <div class="who" v-if="meName">
      <span class="dot"></span><span>กรอกในชื่อ <b>{{ meName }}</b></span>
      <span class="saving" v-if="savingState">{{ savingState }}</span>
      <button class="btn ghost sm" @click="logout">เปลี่ยนชื่อ</button>
    </div>
  </header>

  <div class="banner" v-if="!dbOk && loaded">
    ตอนนี้บันทึกข้อมูลไม่ได้ ต้องเปิดหน้านี้ใน claude.ai และล็อกอินก่อน ข้อมูลที่เห็นจะอัปเดตเมื่อเชื่อมต่อได้
  </div>
  <div class="banner" v-if="readOnly">
    บัญชีนี้ดูได้อย่างเดียว ขอให้เจ้าของหน้าแชร์สิทธิ์แบบ Contributor ให้ก่อนจึงจะลงข้อมูลได้
  </div>

  <!-- profile gate -->
  <section class="board gate" v-if="!meName">
    <h2>คุณคือใคร?</h2>
    <p class="sub">พิมพ์แค่ชื่อพอ ไม่ต้องมีรหัส ชื่อที่ลงข้อมูลไว้แล้วจะเลือกกลับมาใช้ต่อได้</p>
    <div class="gate-grid">
      <div>
        <div class="label" style="margin-bottom:8px">ใช้ชื่อเดิม</div>
        <div class="chips" v-if="activePeople.length">
          <button class="chip" v-for="p in activePeople" :key="p.key" @click="pick(p)">
            {{ p.name }}<small>{{ p.dates.length }} วัน</small>
          </button>
        </div>
        <p class="hint" v-else>ยังไม่มีใครลงข้อมูลในรอบนี้</p>
      </div>
      <form @submit.prevent="createProfile">
        <div class="label" style="margin-bottom:8px">เริ่มด้วยชื่อใหม่</div>
        <div class="row">
          <div class="field">
            <input id="newname" v-model="newName" maxlength="30" placeholder="เช่น ต้น, Mild" autocomplete="nickname">
          </div>
          <button class="btn primary" type="submit">เริ่มเลย</button>
        </div>
        <p class="err" v-if="nameError" style="margin-top:6px">{{ nameError }}</p>
      </form>
    </div>
  </section>

  <!-- calendar -->
  <section class="board">
    <h2>วันว่าง</h2>
    <p class="sub">แตะวันที่เพื่อเพิ่มหรือเอาออก สีเข้มขึ้นแปลว่าว่างกันหลายคน กรอบสีเหลืองคือวันที่คุณลงไว้</p>
    <div class="cal-layout">
      <div>
        <div class="cal-head">
          <button class="btn sm" @click="shiftMonth(-1)" :disabled="!canPrev" aria-label="เดือนก่อน">‹</button>
          <h3>{{ monthTitle }}</h3>
          <button class="btn sm" @click="shiftMonth(1)" aria-label="เดือนถัดไป">›</button>
        </div>
        <div class="cal">
          <div class="wd" v-for="(w,i) in WD" :key="'w'+i" :class="{we:i===0||i===6}">{{ w }}</div>
          <template v-for="c in cells" :key="c.key">
            <div v-if="!c.date" class="day blank"></div>
            <button v-else class="day" :class="dayClass(c)" :disabled="c.past" @click="tapDay(c)"
              :aria-label="c.label + (c.count ? ' ว่าง ' + c.count + ' คน' : '')">
              <span class="n">{{ c.d }}</span>
              <span class="c" v-if="c.count">{{ c.count }}</span>
            </button>
          </template>
        </div>
        <div class="legend">
          <span><i style="box-shadow:inset 0 0 0 3px var(--mine);background:var(--sunk)"></i>คุณว่าง</span>
          <span class="scale"><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i></span>
          <span>ว่าง 1 คน → ว่างครบทุกคน</span>
        </div>
        <div class="daydetail" v-if="selected">
          <strong>{{ fmtLong(selected) }}</strong>
          <div class="names" v-if="(availMap[selected]||[]).length">ว่าง: {{ availMap[selected].join(', ') }}</div>
          <div class="names" v-else>ยังไม่มีใครลงวันนี้</div>
        </div>
      </div>

      <aside class="quick">
        <h3>ลงทีละหลายวัน</h3>
        <div>
          <div class="label" style="margin-bottom:6px">วันในสัปดาห์</div>
          <div class="wdpick">
            <button v-for="(w,i) in WD" :key="'q'+i" :class="{on:quick.days.includes(i)}" @click="toggleQDay(i)" type="button" :aria-pressed="quick.days.includes(i)">{{ w }}</button>
          </div>
        </div>
        <div class="two">
          <div class="field"><label class="label" for="qfrom">ตั้งแต่</label><input id="qfrom" type="date" v-model="quick.from" :min="todayKey"></div>
          <div class="field"><label class="label" for="qto">ถึง</label><input id="qto" type="date" v-model="quick.to" :min="quick.from || todayKey"></div>
        </div>
        <div class="presets">
          <button class="btn sm" @click="preset('weekend')">เสาร์-อาทิตย์ เดือนนี้</button>
          <button class="btn sm" @click="preset('fri')">ศุกร์ทั้งเดือน</button>
          <button class="btn sm" @click="preset('every3')">ทุกวัน 3 เดือน</button>
        </div>
        <p class="hint">{{ quickSummary }}</p>
        <div class="row">
          <button class="btn primary" @click="applyQuick(true)" :disabled="!quickDates.length">ลงว่าง</button>
          <button class="btn" @click="applyQuick(false)" :disabled="!quickDates.length">เอาออก</button>
        </div>
        <button class="btn ghost sm" v-if="me.dates.length" @click="clearMine" style="align-self:flex-start">ล้างวันที่ฉันลงทั้งหมด ({{ me.dates.length }})</button>
      </aside>
    </div>
  </section>

  <!-- date vote -->
  <section class="board">
    <h2>โหวตวัน</h2>
    <p class="sub">วันที่มีคนว่างมากที่สุด เลือกโหวตได้หลายวัน</p>
    <div class="dlist" v-if="topDates.length">
      <div class="drow" v-for="(r,i) in topDates" :key="r.date" :class="{lead: i===0 && r.votes.length}">
        <div class="ddate">{{ fmtShort(r.date) }}<small>{{ fmtWeekday(r.date) }}</small></div>
        <div class="mid">
          <div><b>ว่าง {{ r.names.length }}/{{ activePeople.length }}</b><span class="pill" v-if="r.names.length===activePeople.length && activePeople.length>1">ว่างครบ</span></div>
          <div class="bar"><span :style="{width: (r.names.length/Math.max(1,activePeople.length)*100)+'%'}"></span></div>
          <div class="names">{{ r.names.join(', ') }}<template v-if="r.votes.length"> · โหวต: {{ r.votes.join(', ') }}</template></div>
        </div>
        <button class="vote" :class="{on: me.voteDates.includes(r.date)}" @click="toggleVote('voteDates', r.date)" :aria-pressed="me.voteDates.includes(r.date)">
          {{ me.voteDates.includes(r.date) ? 'โหวตแล้ว' : 'โหวต' }} <span class="k">{{ r.votes.length }}</span>
        </button>
      </div>
    </div>
    <div class="empty" v-else>ยังไม่มีวันว่าง ลงวันในปฏิทินด้านบน แล้ววันที่ว่างตรงกันจะขึ้นที่นี่</div>
  </section>

  <!-- places -->
  <section class="board">
    <h2>สถานที่นัด</h2>
    <p class="sub">แปะลิงก์ Google Maps ให้เพื่อนกดเข้าไปดู แล้วโหวตที่ที่อยากไป</p>
    <form class="pform" @submit.prevent="addPlace">
      <div class="field"><label class="label" for="ptitle">ชื่อที่</label><input id="ptitle" v-model="pf.title" maxlength="80" placeholder="เช่น หมูกระทะ ลาดพร้าว 71"></div>
      <div class="field"><label class="label" for="purl">ลิงก์ Google Maps</label><input id="purl" v-model="pf.url" inputmode="url" placeholder="https://maps.app.goo.gl/…"></div>
      <div class="field full"><label class="label" for="pnote">โน้ต (ไม่บังคับ)</label><textarea id="pnote" v-model="pf.note" maxlength="300" placeholder="ที่จอดรถ ราคาประมาณ ต้องจองก่อนไหม"></textarea></div>
      <div class="full row" style="justify-content:space-between">
        <p class="err" v-if="pfError">{{ pfError }}</p><span v-else></span>
        <button class="btn primary" type="submit">เพิ่มสถานที่</button>
      </div>
    </form>

    <div class="pgrid" v-if="placesSorted.length">
      <article class="place" v-for="(p,i) in placesSorted" :key="p.id" :class="{lead: i===0 && p.votes.length}">
        <a class="mapart" v-if="p.url" :href="p.url" target="_blank" rel="noopener noreferrer" :aria-label="'เปิด ' + p.title + ' ใน Google Maps'">
          <svg class="road" viewBox="0 0 300 110" preserveAspectRatio="none" aria-hidden="true">
            <path :d="roadPath(p.id)" fill="none" stroke="var(--surface)" stroke-width="9" stroke-linecap="round"/>
          </svg>
          <span class="pin"></span>
          <span class="coord" v-if="p.geo">{{ p.geo }}</span>
          <span class="open">เปิดแผนที่ ↗</span>
        </a>
        <div class="mapart" v-else><span class="pin" style="opacity:.4"></span><span class="coord">ไม่มีลิงก์</span></div>
        <div class="pbody">
          <h3>{{ p.title }}</h3>
          <p v-if="p.note">{{ p.note }}</p>
          <div class="pmeta">เสนอโดย {{ p.by }}<template v-if="p.votes.length"> · โหวต: {{ p.votes.join(', ') }}</template></div>
        </div>
        <div class="pfoot">
          <button class="vote" :class="{on: me.votePlaces.includes(p.id)}" @click="toggleVote('votePlaces', p.id)" :aria-pressed="me.votePlaces.includes(p.id)">
            {{ me.votePlaces.includes(p.id) ? 'โหวตแล้ว' : 'โหวต' }} <span class="k">{{ p.votes.length }}</span>
          </button>
          <button class="btn ghost sm" v-if="p.byKey===meKey" @click="removePlace(p)">ลบ</button>
        </div>
      </article>
    </div>
    <div class="empty" v-else style="margin-top:16px">ยังไม่มีสถานที่ เพิ่มที่แรกจากฟอร์มด้านบน</div>
  </section>

  <footer class="foot">
    <p>นัดรอบนี้สำเร็จแล้ว? เริ่มรอบใหม่เพื่อล้างวันว่าง สถานที่ และโหวตของทุกคน</p>
    <button class="btn" style="color:var(--danger);border-color:var(--danger)" @click="resetOpen=true" :disabled="!dbOk">เริ่มนัดรอบใหม่</button>
  </footer>

  <div class="backdrop" v-if="resetOpen" @click.self="resetOpen=false">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rtitle">
      <h3 id="rtitle">ล้างข้อมูลทั้งหมด?</h3>
      <div class="warnbox">วันว่างของ {{ activePeople.length }} คน, สถานที่ {{ places.length }} ที่ และโหวตทั้งหมดจะถูกลบ และกู้คืนไม่ได้</div>
      <div class="field" style="margin-top:12px">
        <label class="label" for="rconfirm">พิมพ์คำว่า “ล้าง” เพื่อยืนยัน</label>
        <input id="rconfirm" v-model="resetText" autocomplete="off">
      </div>
      <div class="acts">
        <button class="btn" @click="resetOpen=false;resetText=''">ยกเลิก</button>
        <button class="btn danger" :disabled="resetText.trim()!=='ล้าง' || resetBusy" @click="doReset">{{ resetBusy ? 'กำลังล้าง…' : 'ล้างทั้งหมด' }}</button>
      </div>
    </div>
  </div>

  <div class="toast" v-if="toast" role="status">{{ toast }}</div>
</div>
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script>
(function(){
const { createApp, reactive, ref, computed } = Vue;
const WD = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const WD_LONG = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MSHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const pad = n => String(n).padStart(2,'0');
const keyOfDate = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const normName = s => s.replace(/\s+/g,' ').trim();
const nameKey = s => 'p' + Array.from(new TextEncoder().encode(normName(s).toLowerCase())).map(b=>b.toString(16).padStart(2,'0')).join('');
const LS = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){} } };

function parseMap(url){
  try{
    const u = new URL(url);
    let name = '', geo = '';
    const m = u.pathname.match(/\/place\/([^/]+)/);
    if (m) name = decodeURIComponent(m[1].replace(/\+/g,' '));
    const c = (u.pathname + u.search).match(/@?(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/);
    if (c) geo = Number(c[1]).toFixed(4)+', '+Number(c[2]).toFixed(4);
    if (!name) { const q = u.searchParams.get('q') || u.searchParams.get('query'); if (q && !/^-?\d/.test(q)) name = q; }
    return { name, geo };
  }catch(e){ return { name:'', geo:'' }; }
}

createApp({
  template: '#tpl',
  setup(){
    const today = new Date(); today.setHours(0,0,0,0);
    const todayKey = keyOfDate(today);
    const loaded = ref(false), dbOk = ref(false), readOnly = ref(false);
    const peopleDocs = ref([]), placeDocs = ref([]);
    const meName = ref(LS.get('wangmai.name') || '');
    const meKey = computed(() => meName.value ? nameKey(meName.value) : '');
    const me = reactive({ dates:[], voteDates:[], votePlaces:[] });
    const view = reactive({ y: today.getFullYear(), m: today.getMonth() });
    const selected = ref('');
    const newName = ref(''), nameError = ref('');
    const endOfMonth = new Date(today.getFullYear(), today.getMonth()+1, 0);
    const quick = reactive({ days:[6], from: todayKey, to: keyOfDate(endOfMonth) });
    const pf = reactive({ title:'', url:'', note:'' }); const pfError = ref('');
    const resetOpen = ref(false), resetText = ref(''), resetBusy = ref(false);
    const toast = ref(''); let toastT;
    const savingState = ref('');
    let db = null;

    function say(msg){ toast.value = msg; clearTimeout(toastT); toastT = setTimeout(()=> toast.value='', 2600); }

    // ---- people (merge my unsaved local state over the store) ----
    const people = computed(() => {
      const list = peopleDocs.value.map(d => ({ key:d.id, name:d.name||'?', dates:d.dates||[], voteDates:d.voteDates||[], votePlaces:d.votePlaces||[] }));
      if (meKey.value){
        const i = list.findIndex(p => p.key === meKey.value);
        const mine = { key:meKey.value, name:meName.value, dates:me.dates, voteDates:me.voteDates, votePlaces:me.votePlaces };
        if (i >= 0) list[i] = mine; else if (me.dates.length || me.voteDates.length || me.votePlaces.length) list.push(mine);
      }
      return list;
    });
    const placeAdders = computed(() => new Set(placeDocs.value.map(p => p.byKey)));
    const activePeople = computed(() => people.value
      .filter(p => p.dates.length || p.voteDates.length || p.votePlaces.length || placeAdders.value.has(p.key))
      .sort((a,b) => a.name.localeCompare(b.name,'th')));

    const availMap = computed(() => {
      const m = {};
      for (const p of activePeople.value) for (const d of p.dates) (m[d] = m[d] || []).push(p.name);
      return m;
    });

    // ---- calendar ----
    const monthTitle = computed(() => MONTHS[view.m] + ' ' + (view.y + 543));
    const canPrev = computed(() => view.y > today.getFullYear() || (view.y === today.getFullYear() && view.m > today.getMonth()));
    const cells = computed(() => {
      const first = new Date(view.y, view.m, 1), n = new Date(view.y, view.m+1, 0).getDate();
      const out = [];
      for (let i=0;i<first.getDay();i++) out.push({ key:'b'+i });
      for (let d=1; d<=n; d++){
        const dt = new Date(view.y, view.m, d), k = keyOfDate(dt);
        out.push({ key:k, date:k, d, past: dt < today, today: k===todayKey, count:(availMap.value[k]||[]).length, label: fmtLong(k) });
      }
      return out;
    });
    function dayClass(c){
      const total = Math.max(1, activePeople.value.length);
      let h = '';
      if (c.count){ const r = c.count/total; h = r>=1 && total>1 ? 'h4' : r>=0.66 ? 'h3' : r>=0.34 ? 'h2' : 'h1'; if (total===1) h='h2'; }
      return [h, { mine: me.dates.includes(c.date), past:c.past, sel: selected.value===c.date, today:c.today }];
    }
    function shiftMonth(n){ let m = view.m + n, y = view.y; if (m<0){m=11;y--} if (m>11){m=0;y++} view.m=m; view.y=y; }

    function needName(){
      if (!meName.value){ say('พิมพ์ชื่อก่อนเริ่มลงข้อมูล'); window.scrollTo({top:0,behavior:'smooth'}); return true; }
      if (!dbOk.value || readOnly.value){ say('ยังบันทึกข้อมูลไม่ได้'); return true; }
      return false;
    }
    function tapDay(c){
      selected.value = c.date;
      if (c.past || needName()) return;
      const i = me.dates.indexOf(c.date);
      if (i>=0) me.dates.splice(i,1); else me.dates.push(c.date);
      me.dates.sort(); queueSave();
    }

    // ---- quick fill ----
    function toggleQDay(i){ const k = quick.days.indexOf(i); k>=0 ? quick.days.splice(k,1) : quick.days.push(i); }
    const quickDates = computed(() => {
      if (!quick.from || !quick.to || !quick.days.length) return [];
      let a = parseKey(quick.from), b = parseKey(quick.to);
      if (a < today) a = new Date(today);
      if (b < a) return [];
      const out = [];
      for (let d = new Date(a); d <= b && out.length < 800; d.setDate(d.getDate()+1)) if (quick.days.includes(d.getDay())) out.push(keyOfDate(d));
      return out;
    });
    const quickSummary = computed(() => {
      if (!quick.days.length) return 'เลือกวันในสัปดาห์อย่างน้อย 1 วัน';
      if (!quickDates.value.length) return 'ไม่มีวันที่ตรงกับช่วงนี้';
      const q = quickDates.value;
      return 'ตรงกับ ' + q.length + ' วัน (' + fmtShort(q[0]) + (q.length>1 ? ' – ' + fmtShort(q[q.length-1]) : '') + ')';
    });
    function preset(kind){
      const y = view.y, m = view.m;
      const s = new Date(y,m,1), e = new Date(y,m+1,0);
      const from = s < today ? today : s;
      if (kind==='weekend'){ quick.days.splice(0, 9, 0, 6); quick.from = keyOfDate(from); quick.to = keyOfDate(e); }
      if (kind==='fri'){ quick.days.splice(0, 9, 5); quick.from = keyOfDate(from); quick.to = keyOfDate(e); }
      if (kind==='every3'){ quick.days.splice(0, 9, 0,1,2,3,4,5,6); quick.from = keyOfDate(from); quick.to = keyOfDate(new Date(y,m+3,0)); }
    }
    function applyQuick(add){
      if (needName()) return;
      const set = new Set(me.dates), q = quickDates.value;
      let changed = 0;
      for (const d of q){ if (add && !set.has(d)){ set.add(d); changed++; } if (!add && set.has(d)){ set.delete(d); changed++; } }
      me.dates.splice(0, me.dates.length, ...Array.from(set).sort());
      if (changed) queueSave();
      say(add ? 'ลงว่างเพิ่ม ' + changed + ' วัน' : 'เอาออก ' + changed + ' วัน');
    }
    function clearMine(){ if (needName()) return; me.dates.splice(0); queueSave(); say('ล้างวันว่างของคุณแล้ว'); }

    // ---- votes ----
    const topDates = computed(() => {
      const votes = {};
      for (const p of activePeople.value) for (const d of p.voteDates) (votes[d] = votes[d] || []).push(p.name);
      const keys = new Set(Object.keys(availMap.value).concat(Object.keys(votes)));
      return Array.from(keys).filter(d => d >= todayKey)
        .map(d => ({ date:d, names: availMap.value[d] || [], votes: votes[d] || [] }))
        .sort((a,b) => (b.votes.length - a.votes.length) || (b.names.length - a.names.length) || a.date.localeCompare(b.date))
        .slice(0, 10);
    });
    function toggleVote(field, val){
      if (needName()) return;
      const arr = me[field], i = arr.indexOf(val);
      i>=0 ? arr.splice(i,1) : arr.push(val);
      queueSave();
    }

    // ---- places ----
    const placesSorted = computed(() => {
      const votes = {};
      for (const p of activePeople.value) for (const id of p.votePlaces) (votes[id] = votes[id] || []).push(p.name);
      return placeDocs.value.map(p => ({ ...p, geo: parseMap(p.url||'').geo, votes: votes[p.id] || [] }))
        .sort((a,b) => (b.votes.length - a.votes.length) || ((a.createdAt||0) - (b.createdAt||0)));
    });
    async function addPlace(){
      pfError.value = '';
      if (needName()) return;
      let url = pf.url.trim();
      if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
      if (url){ try{ const u = new URL(url); if (!/^https?:$/.test(u.protocol)) throw 0; }catch(e){ pfError.value = 'ลิงก์ไม่ถูกต้อง ลองคัดลอกจากปุ่ม "แชร์" ใน Google Maps อีกครั้ง'; return; } }
      const title = normName(pf.title) || parseMap(url).name;
      if (!title){ pfError.value = 'ใส่ชื่อสถานที่ หรือแปะลิงก์ที่มีชื่อสถานที่อยู่'; return; }
      try{
        await db.collection('places').add({ title: title.slice(0,80), url, note: pf.note.trim().slice(0,300), by: meName.value, byKey: meKey.value, createdAt: Date.now() });
        pf.title = ''; pf.url = ''; pf.note = '';
        say('เพิ่ม ' + title + ' แล้ว');
      }catch(e){ handleWriteError(e); }
    }
    async function removePlace(p){
      try{
        await db.collection('places').doc(p.id).delete();
        const i = me.votePlaces.indexOf(p.id); if (i>=0){ me.votePlaces.splice(i,1); queueSave(); }
        say('ลบ ' + p.title + ' แล้ว');
      }catch(e){ handleWriteError(e); }
    }
    function roadPath(id){
      let h = 0; for (const ch of id) h = (h*31 + ch.charCodeAt(0)) >>> 0;
      const y1 = 20 + h % 70, y2 = 20 + (h>>5) % 70, x = 60 + (h>>9) % 180;
      return 'M-10 '+y1+' C '+(x-40)+' '+y1+', '+(x+40)+' '+y2+', 310 '+y2+' M'+x+' -10 L'+(x+((h>>13)%40-20))+' 120';
    }

    // ---- profile ----
    function syncMeFromStore(){
      const d = peopleDocs.value.find(p => p.id === meKey.value);
      me.dates.splice(0, me.dates.length, ...((d && d.dates) || []));
      me.voteDates.splice(0, me.voteDates.length, ...((d && d.voteDates) || []));
      me.votePlaces.splice(0, me.votePlaces.length, ...((d && d.votePlaces) || []));
    }
    function pick(p){ meName.value = p.name; LS.set('wangmai.name', p.name); syncMeFromStore(); say('ยินดีต้อนรับกลับ ' + p.name); }
    function createProfile(){
      nameError.value = '';
      const n = normName(newName.value);
      if (!n){ nameError.value = 'พิมพ์ชื่อก่อน'; return; }
      const k = nameKey(n);
      if (activePeople.value.some(p => p.key === k)){ nameError.value = 'ชื่อ "' + n + '" มีคนใช้อยู่แล้ว ถ้าเป็นคุณ ให้เลือกจาก "ใช้ชื่อเดิม" หรือพิมพ์ชื่ออื่น'; return; }
      meName.value = n; LS.set('wangmai.name', n); newName.value = '';
      syncMeFromStore();
      say('สวัสดี ' + n + ' เริ่มลงวันว่างได้เลย');
    }
    function logout(){ flushNow(); meName.value = ''; LS.set('wangmai.name', null); me.dates.splice(0); me.voteDates.splice(0); me.votePlaces.splice(0); }

    // ---- saving: one write at a time for my doc, coalesced ----
    let saveTimer = null, saving = false, dirty = false;
    function queueSave(){ dirty = true; savingState.value = 'กำลังบันทึก…'; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 450); }
    function flushNow(){ if (dirty){ clearTimeout(saveTimer); flush(); } }
    async function flush(){
      if (saving || !db || !meKey.value) return;
      saving = true;
      while (dirty){
        dirty = false;
        const key = meKey.value;
        const body = { name: meName.value, dates: me.dates.slice(), voteDates: me.voteDates.slice(), votePlaces: me.votePlaces.slice(), updatedAt: Date.now() };
        try{ await db.collection('people').doc(key).set(body); }
        catch(e){ handleWriteError(e); dirty = false; }
      }
      saving = false;
      savingState.value = 'บันทึกแล้ว'; setTimeout(()=>{ if (!saving && !dirty) savingState.value=''; }, 1500);
    }
    function handleWriteError(e){
      const code = e && e.code;
      if (code === 'invalid_argument'){ readOnly.value = true; say('บันทึกไม่ได้ บัญชีนี้ดูได้อย่างเดียว'); }
      else if (code === 'quota_exceeded') say('พื้นที่เก็บข้อมูลเต็ม ลองเริ่มนัดรอบใหม่');
      else if (code === 'resource_exhausted') say('กดเร็วไปนิด รอสักครู่แล้วลองใหม่');
      else say('บันทึกไม่สำเร็จ ลองอีกครั้ง');
      savingState.value = '';
    }

    // ---- reset ----
    async function doReset(){
      resetBusy.value = true;
      try{
        const ps = await db.collection('people').get();
        for (const d of ps.docs) await db.collection('people').doc(d.id).delete();
        const pl = await db.collection('places').get();
        for (const d of pl.docs) await db.collection('places').doc(d.id).delete();
        dirty = false; clearTimeout(saveTimer);
        me.dates.splice(0); me.voteDates.splice(0); me.votePlaces.splice(0);
        resetOpen.value = false; resetText.value = ''; selected.value = '';
        say('เริ่มนัดรอบใหม่แล้ว');
      }catch(e){ handleWriteError(e); }
      resetBusy.value = false;
    }

    // ---- connect ----
    (async () => {
      try{
        db = window.claude && window.claude.use ? await window.claude.use('db') : null;
        if (db){
          dbOk.value = true;
          try{
            const user = await window.claude.use('user');
            if (user && user.can){ const w = await user.can('data.write'); if (w === false) readOnly.value = true; }
          }catch(e){}
          db.collection('people').onSnapshot(s => {
            peopleDocs.value = s.docs.map(d => ({ id:d.id, ...d.data() }));
            if (meKey.value && !dirty && !saving) syncMeFromStore();
          }, () => { dbOk.value = false; });
          db.collection('places').onSnapshot(s => {
            placeDocs.value = s.docs.map(d => ({ id:d.id, ...d.data() }));
          }, () => {});
        }
      }catch(e){ db = null; }
      loaded.value = true;
    })();
    window.addEventListener('pagehide', flushNow);

    function fmtShort(k){ const d = parseKey(k); return d.getDate() + ' ' + MSHORT[d.getMonth()]; }
    function fmtWeekday(k){ const d = parseKey(k); return 'วัน' + WD_LONG[d.getDay()] + (d.getFullYear() !== today.getFullYear() ? ' ' + (d.getFullYear()+543) : ''); }
    function fmtLong(k){ const d = parseKey(k); return 'วัน' + WD_LONG[d.getDay()] + 'ที่ ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + (d.getFullYear()+543); }

    return { WD, todayKey, loaded, dbOk, readOnly, meName, meKey, me, activePeople, availMap, monthTitle, canPrev, cells, dayClass, shiftMonth,
      selected, tapDay, quick, toggleQDay, quickDates, quickSummary, preset, applyQuick, clearMine, topDates, toggleVote,
      places: placeDocs, placesSorted, pf, pfError, addPlace, removePlace, roadPath, newName, nameError, pick, createProfile, logout,
      savingState, resetOpen, resetText, resetBusy, doReset, toast, fmtShort, fmtWeekday, fmtLong };
  }
}).mount('#app');
})();
</script>
