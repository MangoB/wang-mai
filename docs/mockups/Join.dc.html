<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ว่างไหม: เข้าห้อง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@600;700&display=swap">
<style>
body{margin:0}
a{color:#1B2236}a:hover{color:#4F5874}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #1B2236;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F9; color: #1B2236; font-family: Anuphan, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; padding: 56px 20px 28px; gap: 28px; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(4, 18px); gap: 4px" aria-hidden="true">
      <sc-for list="{{logo}}" as="c" hint-placeholder-count="8"><span style="{{c}}"></span></sc-for>
    </div>
    <h1 style="margin: 0; font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 44px; line-height: 1">ว่างไหม</h1>
    <p style="margin: 0; color: #4F5874; max-width: 30ch">แปะวันว่างของแต่ละคน แล้วดูว่าวันไหนว่างกันครบแก๊ง</p>
  </div>

  <form style="background: #FFFFFF; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-size: 17px; font-weight: 600">มีรหัสจากเพื่อน</h2>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="roomCode" style="font-size: 14px; font-weight: 600">รหัสห้อง</label>
      <input id="roomCode" value="K7Q-2MF" autocomplete="off" style="height: 52px; border-radius: 12px; border: 1.5px solid #1B2236; padding: 0 14px; font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.12em; color: #1B2236">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="guestCode" style="font-size: 14px; font-weight: 600">รหัสส่วนตัว</label>
      <input id="guestCode" placeholder="8 ตัว ถ้าเพื่อนสร้างให้" autocomplete="off" style="height: 52px; border-radius: 12px; border: 1px solid #DCE1EA; padding: 0 14px; font-size: 16px; color: #1B2236">
      <span style="font-size: 13px; color: #4F5874">ไม่มีรหัสส่วนตัว? เข้าด้วย Google แล้วตั้งชื่อเองได้</span>
    </div>
    <a href="Main.dc.html" style="height: 52px; border-radius: 12px; background: #1B2236; color: #FFFFFF; display: grid; place-items: center; font-weight: 600; font-size: 16px; text-decoration: none">เข้าห้อง</a>
    <div style="display: flex; align-items: center; gap: 10px; color: #4F5874; font-size: 13px">
      <span style="flex: 1; height: 1px; background: #DCE1EA"></span>หรือ<span style="flex: 1; height: 1px; background: #DCE1EA"></span>
    </div>
    <button type="button" style="height: 52px; border-radius: 12px; border: 1px solid #DCE1EA; background: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 12h8"></path></svg>
      เข้าด้วย Google
    </button>
  </form>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 15px; font-weight: 600">ห้องที่เคยเข้าในเครื่องนี้</h2>
    <a href="Summary.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; text-decoration: none; border: 1px solid #DCE1EA">
      <span style="width: 22px; height: 22px; border-radius: 4px; background: #3E63DD; color: #FFFFFF; display: grid; place-items: center; font-size: 11px; font-weight: 600">ท</span>
      <span style="flex: 1"><span style="font-weight: 600">แก๊งมหาลัย</span><br><span style="font-size: 13px; color: #4F5874">ในชื่อ ทราย</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F5874" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var COLORS = ['#E5484D', '#3E63DD', '#30A46C', '#D6409F', '#F5B100', '#8E4EC6', '#0091D5', '#F76B15'];
    return { logo: COLORS.map(function (c) { return 'width: 18px; height: 18px; border-radius: 3px; background: ' + c; }) };
  }
}
</script>
</body>
</html>
