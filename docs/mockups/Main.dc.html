<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ว่างไหม: ปฏิทินนัด</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@600;700&display=swap">
<style>
body{margin:0}
a{color:#1B2236}a:hover{color:#4F5874}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #1B2236;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F9; color: #1B2236; font-family: Anuphan, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Summary.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 13px; color: #4F5874">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        แก๊งมหาลัย
      </a>
      <a href="Members.dc.html" style="display: flex; gap: 3px; text-decoration: none" aria-label="สมาชิก 8 คน">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="8">
          <span style="{{p.chip}}">{{p.initial}}</span>
        </sc-for>
      </a>
    </div>
    <div>
      <h1 style="margin: 0; font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.15">ข้าวเย็นปลายปี</h1>
      <p style="margin: 4px 0 0; color: #4F5874; font-size: 14px">ลงว่างแล้ว 8 จาก 8 คน</p>
    </div>
  </header>

  <section style="margin: 0 12px; background: #FFFFFF; border-radius: 18px; padding: 14px 10px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <button type="button" aria-label="เดือนก่อน" style="width: 44px; height: 36px; border: 0; background: transparent; border-radius: 10px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <h2 style="margin: 0; font-family: 'Bai Jamjuree', sans-serif; font-weight: 600; font-size: 17px">พฤศจิกายน 2569</h2>
      <button type="button" aria-label="เดือนถัดไป" style="width: 44px; height: 36px; border: 0; background: transparent; border-radius: 10px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
        <span style="{{w.style}}">{{w.label}}</span>
      </sc-for>
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
        <button type="button" onClick="{{c.tap}}" aria-label="{{c.label}}" style="{{c.style}}">
          <span style="{{c.numStyle}}">{{c.num}}</span>
          <span style="{{c.quiltStyle}}">
            <sc-for list="{{c.stickers}}" as="s" hint-placeholder-count="3">
              <span style="{{s}}"></span>
            </sc-for>
          </span>
        </button>
      </sc-for>
    </div>
  </section>

  <section style="margin: 12px 12px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 10px; background: #1B2236; color: #FFFFFF; border-radius: 14px; padding: 12px 14px">
      <span style="{{rainbowMini}}" aria-hidden="true"></span>
      <div style="flex: 1; min-width: 0">
        <div style="font-weight: 600">{{allFreeTitle}}</div>
        <div style="font-size: 13px; color: #C9D0E2">{{allFreeSub}}</div>
      </div>
      <a href="Draw.dc.html" style="color: #FFFFFF; font-weight: 600; font-size: 14px; padding: 10px 12px; border: 1px solid #4F5874; border-radius: 10px; text-decoration: none">สุ่มวัน</a>
    </div>
    <p style="margin: 0; font-size: 13px; color: #4F5874; padding: 0 4px">แตะวันเพื่อลงหรือเอาวันที่คุณว่างออก กรอบหมึกคือสติกเกอร์ของคุณ</p>
  </section>

  <nav style="margin-top: auto; background: #FFFFFF; border-top: 1px solid #DCE1EA; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 22px" aria-label="เมนูนัด">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; text-decoration: none; color: #1B2236; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      วันว่าง
    </a>
    <a href="Places.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; text-decoration: none; color: #4F5874; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      ที่นัด
    </a>
    <a href="Draw.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; text-decoration: none; color: #4F5874; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><circle cx="9" cy="9" r="1.2" fill="currentColor"></circle><circle cx="15" cy="15" r="1.2" fill="currentColor"></circle><circle cx="15" cy="9" r="1.2" fill="currentColor"></circle><circle cx="9" cy="15" r="1.2" fill="currentColor"></circle></svg>
      สุ่ม
    </a>
    <a href="Summary.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; text-decoration: none; color: #4F5874; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>
      สรุป
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { mine: [8, 12, 13, 14, 18, 21, 22, 26, 28, 29] };
  }
  renderVals() {
    var COLORS = ['#E5484D', '#3E63DD', '#30A46C', '#D6409F', '#F5B100', '#8E4EC6', '#0091D5', '#F76B15'];
    var NAMES = ['ณัฐ', 'ทราย', 'มอส', 'แนน', 'เบียร์', 'แพร', 'หมก', 'ใหญ่'];
    var DARK_TEXT = { 4: true };
    var ME = 1;
    var others = {
      1: [0, 3], 2: [2, 5], 3: [6], 4: [0, 4], 5: [], 6: [2, 3, 7],
      7: [0, 2, 3, 4, 5, 6, 7], 8: [3], 9: [5], 10: [], 11: [2, 6], 12: [], 13: [0, 3, 4],
      14: [0, 2, 3, 4, 5, 6, 7], 15: [0, 2, 3, 4, 6], 16: [6], 17: [], 18: [7], 19: [], 20: [0, 3, 5],
      21: [0, 2, 3, 4, 5, 6, 7], 22: [2, 4, 5, 6, 7], 23: [], 24: [3], 25: [], 26: [0], 27: [2, 4, 6],
      28: [0, 2, 3, 4, 5, 7], 29: [3, 4], 30: []
    };
    var mine = this.state.mine;
    var self = this;
    var TODAY = 7;
    var N = NAMES.length;

    var people = NAMES.map(function (n, i) {
      return {
        initial: n.charAt(0),
        chip: 'width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: ' + COLORS[i] + '; color: ' + (DARK_TEXT[i] ? '#1B2236' : '#FFFFFF') + (i === ME ? '; box-shadow: 0 0 0 2px #F3F5F9, 0 0 0 3.5px #1B2236' : '')
      };
    });

    var weekdays = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map(function (l, i) {
      return { label: l, style: 'text-align: center; font-size: 12px; font-weight: 600; padding: 2px 0 4px; color: ' + (i === 0 || i === 6 ? '#1B2236' : '#4F5874') };
    });

    function stripes() {
      var parts = [];
      for (var i = 0; i < N; i++) parts.push(COLORS[i] + ' ' + (i * 7) + 'px ' + ((i + 1) * 7) + 'px');
      return 'repeating-linear-gradient(135deg, ' + parts.join(', ') + ')';
    }

    var allFree = [];
    var cells = [];
    for (var d = 1; d <= 30; d++) {
      var who = (others[d] || []).slice();
      var iAmFree = mine.indexOf(d) >= 0;
      if (iAmFree) who.push(ME);
      who.sort(function (a, b) { return a - b; });
      var past = d < TODAY;
      var count = who.length;
      var full = count === N && !past;
      var near = count === N - 1 && !past;
      if (full) allFree.push(d);

      var base = 'position: relative; height: 66px; border-radius: 8px; padding: 5px 4px 5px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; cursor: pointer; text-align: left; min-width: 0; ';
      var style, numStyle;
      if (full) {
        style = base + 'border: 0; background: ' + stripes() + ';';
        numStyle = "font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 13px; background: #1B2236; color: #FFFFFF; border-radius: 5px; padding: 1px 6px; line-height: 1.5";
      } else {
        style = base + 'background: ' + (near ? '#FFFFFF' : (count ? '#F7F8FB' : '#FFFFFF')) + '; border: ' + (near ? '1.5px dashed #1B2236' : '1px solid #DCE1EA') + ';' + (past ? ' opacity: 0.4; cursor: default;' : '');
        numStyle = "font-family: 'Bai Jamjuree', sans-serif; font-size: 14px; line-height: 1.2; font-weight: " + (iAmFree ? '700' : '600') + '; color: ' + (iAmFree ? '#1B2236' : '#4F5874') + (d === TODAY ? '; text-decoration: underline; text-underline-offset: 3px' : '');
      }

      var stickers = [];
      if (!full) {
        for (var k = 0; k < N; k++) {
          if (who.indexOf(k) >= 0) {
            stickers.push('width: 8px; height: 8px; border-radius: 2px; background: ' + COLORS[k] + (k === ME ? '; box-shadow: 0 0 0 1.5px #1B2236' : ''));
          } else if (near) {
            stickers.push('width: 8px; height: 8px; border-radius: 2px; box-sizing: border-box; border: 1.5px dashed #1B2236');
          }
        }
      }
      var missing = near ? NAMES[[0,1,2,3,4,5,6,7].filter(function (k) { return who.indexOf(k) < 0; })[0]] : '';
      cells.push({
        num: d,
        style: style,
        numStyle: numStyle,
        quiltStyle: full ? 'display: none' : 'display: grid; grid-template-columns: repeat(4, 8px); gap: 2px',
        stickers: stickers,
        label: d + ' พฤศจิกายน, ว่าง ' + count + ' จาก ' + N + ' คน' + (full ? ', ว่างครบแก๊ง' : '') + (near ? ', ขาด' + missing : '') + (iAmFree ? ', คุณว่าง' : ''),
        tap: past ? function () {} : (function (day) {
          return function () {
            var m = self.state.mine.slice();
            var i = m.indexOf(day);
            if (i >= 0) m.splice(i, 1); else m.push(day);
            self.setState({ mine: m });
          };
        })(d)
      });
    }

    var blank = [];
    // 1 Nov 2569 (2026) is a Sunday: no leading blanks.
    var dayNames = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    var list = allFree.map(function (d) { return dayNames[d % 7 === 0 ? 6 : (d % 7) - 1] + ' ' + d; });
    return {
      people: people,
      weekdays: weekdays,
      cells: blank.concat(cells),
      rainbowMini: 'width: 28px; height: 28px; border-radius: 6px; flex: none; background: ' + stripes(),
      allFreeTitle: allFree.length ? 'ว่างครบแก๊ง ' + allFree.length + ' วัน' : 'ยังไม่มีวันที่ว่างครบ',
      allFreeSub: allFree.length ? list.join(', ') + ' พฤศจิกายน' : 'ใกล้สุด: ขาดอีก 1 คน'
    };
  }
}
</script>
</body>
</html>
