<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ว่างไหม: สมาชิกห้อง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@600;700&display=swap">
<style>
body{margin:0}
a{color:#1B2236}a:hover{color:#4F5874}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #1B2236;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F9; color: #1B2236; font-family: Anuphan, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 4px">
    <a href="Summary.dc.html" style="font-size: 13px; color: #4F5874; text-decoration: none">แก๊งมหาลัย</a>
    <h1 style="margin: 0; font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 28px">สมาชิก 8 คน</h1>
  </header>

  <section style="margin: 0 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
    <div style="background: #1B2236; color: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #C9D0E2">รหัสห้อง</span>
      <span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.1em">K7Q-2MF</span>
      <button type="button" style="margin-top: 4px; align-self: flex-start; height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid #4F5874; background: transparent; color: #FFFFFF; font-size: 13px; cursor: pointer">เปลี่ยนรหัส</button>
    </div>
    <button type="button" style="border: 1.5px dashed #1B2236; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 12px 14px; cursor: pointer; text-align: left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      <span style="font-weight: 600">เชิญเพื่อน</span>
      <span style="font-size: 13px; color: #4F5874">สร้างรหัสให้คนที่ไม่ใช้ Google</span>
    </button>
  </section>

  <section style="margin: 10px 12px 0; background: #FFFFFF; border-radius: 16px; border: 1px solid #DCE1EA; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
    <span style="width: 22px; height: 22px; border-radius: 4px; background: #12A594; color: #FFFFFF; display: grid; place-items: center; font-size: 11px; font-weight: 600" aria-hidden="true">ต</span>
    <div style="flex: 1; min-width: 0">
      <div style="font-weight: 600">ลิงก์เชิญ ต้น</div>
      <div style="font-size: 13px; color: #4F5874">รหัสส่วนตัว <span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 600; letter-spacing: 0.08em">HX4P-9KTW</span>, ยังไม่ได้เข้า</div>
    </div>
    <button type="button" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 0; background: #1B2236; color: #FFFFFF; font-weight: 600; font-size: 14px; cursor: pointer">คัดลอก</button>
  </section>

  <ul style="list-style: none; margin: 14px 12px 0; padding: 0; background: #FFFFFF; border-radius: 18px; overflow: hidden">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="8">
      <li style="{{p.row}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="{{p.chip}}" aria-hidden="true">{{p.initial}}</span>
          <div style="flex: 1; min-width: 0">
            <div style="{{p.nameStyle}}">{{p.name}}</div>
            <div style="font-size: 12px; color: #4F5874">{{p.meta}}</div>
          </div>
          <sc-if value="{{p.tag}}" hint-placeholder-val="{{ false }}">
            <span style="{{p.tagStyle}}">{{p.tag}}</span>
          </sc-if>
          <sc-if value="{{p.canManage}}" hint-placeholder-val="{{ true }}">
            <button type="button" aria-label="{{p.menuLabel}}" aria-expanded="{{p.openAttr}}" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; display: grid; place-items: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
            </button>
          </sc-if>
        </div>
        <sc-if value="{{p.open}}" hint-placeholder-val="{{ false }}">
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px">
            <button type="button" style="height: 40px; border-radius: 10px; border: 1px solid #DCE1EA; background: #FFFFFF; font-size: 13px; cursor: pointer">ซ่อนนัดนี้</button>
            <button type="button" style="height: 40px; border-radius: 10px; border: 1px solid #DCE1EA; background: #FFFFFF; font-size: 13px; cursor: pointer">ตั้ง co-host</button>
            <button type="button" style="height: 40px; border-radius: 10px; border: 1px solid #DCE1EA; background: #FFFFFF; font-size: 13px; cursor: pointer">เตะออก</button>
            <button type="button" style="height: 40px; border-radius: 10px; border: 1px solid #C8332F; background: #FFFFFF; color: #C8332F; font-size: 13px; font-weight: 600; cursor: pointer">บล็อก</button>
          </div>
        </sc-if>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      { n: 'ทราย', c: '#3E63DD', meta: 'Google', tag: 'เจ้าของ', me: true },
      { n: 'ณัฐ', c: '#E5484D', meta: 'Google', tag: 'co-host' },
      { n: 'มอส', c: '#30A46C', meta: 'รหัสส่วนตัว' },
      { n: 'แนน', c: '#D6409F', meta: 'Google' },
      { n: 'เบียร์', c: '#F5B100', meta: 'รหัสส่วนตัว', dark: true },
      { n: 'แพร', c: '#8E4EC6', meta: 'Google, ซ่อนจากนัดนี้', hidden: true },
      { n: 'หมก', c: '#0091D5', meta: 'รหัสส่วนตัว' },
      { n: 'somchai_99', c: '#56607A', meta: 'Google, เข้าเมื่อ 10 นาทีก่อน', tag: 'ไม่รู้จัก?', open: true, stranger: true }
    ];
    return {
      people: rows.map(function (r, i) {
        return {
          name: r.n + (r.me ? ' (คุณ)' : ''),
          initial: r.n.charAt(0),
          meta: r.meta,
          tag: r.tag || '',
          tagStyle: 'font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; ' + (r.stranger ? 'background: #FBE3E1; color: #9B231F' : 'background: #F3F5F9; color: #1B2236'),
          canManage: !r.me,
          open: !!r.open,
          openAttr: r.open ? 'true' : 'false',
          menuLabel: 'จัดการ ' + r.n,
          row: 'padding: 10px 14px; ' + (i ? 'border-top: 1px solid #DCE1EA; ' : '') + (r.open ? 'background: #FFF7F6' : ''),
          nameStyle: 'font-weight: 600' + (r.hidden ? '; color: #4F5874; text-decoration: line-through' : ''),
          chip: 'width: 28px; height: 28px; border-radius: 5px; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: ' + r.c + '; color: ' + (r.dark ? '#1B2236' : '#FFFFFF') + (r.hidden ? '; opacity: 0.4' : '')
        };
      })
    };
  }
}
</script>
</body>
</html>
