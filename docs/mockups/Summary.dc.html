<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ว่างไหม: ห้องและนัดที่สรุปแล้ว</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@600;700&display=swap">
<style>
body{margin:0}
a{color:#1B2236}a:hover{color:#4F5874}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #1B2236;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F9; color: #1B2236; font-family: Anuphan, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 16px 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
    <div>
      <p style="margin: 0; font-size: 13px; color: #4F5874">ห้องของคุณ</p>
      <h1 style="margin: 2px 0 0; font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.1">แก๊งมหาลัย</h1>
    </div>
    <a href="Members.dc.html" style="display: flex; gap: 3px; text-decoration: none" aria-label="สมาชิก 8 คน">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="8"><span style="{{c}}"></span></sc-for>
    </a>
  </header>

  <section style="margin: 12px 12px 0; background: #FFFFFF; border-radius: 18px; overflow: hidden; border: 1.5px solid #1B2236">
    <div style="{{band}}" aria-hidden="true"></div>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>
        สรุปนัดแล้ว: ข้าวเย็นปลายปี
      </div>
      <div style="display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center">
        <div style="width: 68px; border-radius: 12px; overflow: hidden; text-align: center; border: 1px solid #DCE1EA">
          <div style="background: #1B2236; color: #FFFFFF; font-size: 12px; font-weight: 600; padding: 3px 0">พ.ย.</div>
          <div style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.3">21</div>
          <div style="font-size: 12px; color: #4F5874; padding-bottom: 4px">เสาร์</div>
        </div>
        <div style="min-width: 0">
          <div style="font-size: 19px; font-weight: 600">หมูกระทะริมคลอง</div>
          <div style="font-size: 13px; color: #4F5874">ลาดพร้าว 71, วังทองหลาง</div>
          <div style="font-size: 13px; color: #4F5874; margin-top: 6px">วันมาจากการสุ่มครั้งที่ 1 ที่จากโหวต 5 เสียง</div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <a href="https://maps.google.com" style="height: 44px; border-radius: 12px; border: 1px solid #DCE1EA; display: grid; place-items: center; text-decoration: none; font-weight: 600; font-size: 14px">เปิดแผนที่</a>
        <button type="button" style="height: 44px; border-radius: 12px; border: 1px solid #DCE1EA; background: #FFFFFF; font-weight: 600; font-size: 14px; cursor: pointer">คัดลอกไปแชท</button>
      </div>
    </div>
  </section>

  <section style="margin: 18px 12px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 600">นัดที่กำลังหาวัน</h2>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #1B2236; color: #FFFFFF; font-weight: 600; font-size: 14px; cursor: pointer">นัดใหม่</button>
    </div>
    <a href="Main.dc.html" style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; border: 1px solid #DCE1EA">
      <div style="flex: 1; min-width: 0">
        <div style="font-weight: 600">ทริปเขาใหญ่ ม.ค.</div>
        <div style="font-size: 13px; color: #4F5874">ลงว่างแล้ว 5 จาก 8 คน</div>
      </div>
      <span style="display: flex; gap: 2px">
        <sc-for list="{{partial}}" as="c" hint-placeholder-count="8"><span style="{{c}}"></span></sc-for>
      </span>
    </a>
  </section>

  <section style="margin: 18px 12px 0; display: flex; flex-direction: column; gap: 6px">
    <h2 style="margin: 0 4px 2px; font-size: 17px; font-weight: 600">เคยไปกันแล้ว</h2>
    <sc-for list="{{past}}" as="p" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 10px 4px; border-bottom: 1px solid #DCE1EA">
        <span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 600; font-size: 14px; color: #4F5874">{{p.date}}</span>
        <span><span style="font-weight: 600">{{p.title}}</span><br><span style="font-size: 13px; color: #4F5874">{{p.place}}</span></span>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var COLORS = ['#E5484D', '#3E63DD', '#30A46C', '#D6409F', '#F5B100', '#8E4EC6', '#0091D5', '#F76B15'];
    var band = 'height: 10px; background: linear-gradient(90deg, ' + COLORS.map(function (c, i) { return c + ' ' + (i * 12.5) + '% ' + ((i + 1) * 12.5) + '%'; }).join(', ') + ')';
    var filled = [0, 1, 2, 4, 6];
    return {
      band: band,
      chips: COLORS.map(function (c) { return 'width: 14px; height: 14px; border-radius: 3px; background: ' + c; }),
      partial: COLORS.map(function (c, i) { return 'width: 8px; height: 8px; border-radius: 2px; ' + (filled.indexOf(i) >= 0 ? 'background: ' + c : 'box-sizing: border-box; border: 1.5px solid #DCE1EA'); }),
      past: [
        { date: '12 ก.ย.', title: 'วันเกิดแนน', place: 'คาเฟ่ดาดฟ้าย่านอารีย์' },
        { date: '30 ก.ค.', title: 'ดูหนังรอบดึก', place: 'โรงหนังใกล้ BTS' },
        { date: '3 พ.ค.', title: 'ข้าวเย็นหลังสงกรานต์', place: 'ร้านข้าวต้มโต้รุ่ง' }
      ]
    };
  }
}
</script>
</body>
</html>
